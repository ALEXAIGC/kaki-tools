<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>关于 Kaki Tools</title>
  <link rel="stylesheet" href="about.css">
</head>
<body>
  <main>
    <header>
      <img src="assets/kaki-logo-256.png" alt="Kaki Tools 标志">
      <div><span class="eyebrow">KAKI AIGC STUDIO · COMPANION</span><h1>Kaki Tools</h1><p class="tagline">KAKI AIGC Studio 的效率扩展工具</p></div>
    </header>
    <p class="intro">一个本地优先的桌面小工具，为创作与日常工作提供更快、更顺手的操作入口。</p>
    <section aria-labelledby="features-title">
      <h2 id="features-title">当前能力</h2>
      <ul>
        <li><strong>剪贴板历史</strong><span>快速检索、固定并回贴常用内容</span></li>
        <li><strong>区域截图</strong><span>调用 macOS 原生选区，自动进入历史</span></li>
        <li><strong>窗口排列</strong><span>用自定义快捷键快速调整工作区</span></li>
      </ul>
    </section>
    <section class="local" aria-labelledby="local-title">
      <h2 id="local-title">本地优先</h2>
      <p>剪贴板历史保存在这台 Mac 上，不会上传至服务端。</p>
    </section>
    <footer><span id="app-version">版本</span><span>© KAKI AIGC Studio</span></footer>
  </main>
  <script src="about.js"></script>
