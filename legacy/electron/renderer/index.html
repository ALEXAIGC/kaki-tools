<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>Kaki Tools</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="commandbar">
    <div id="brand-lockup" aria-label="Kaki Tools">
      <div id="brand-mark">
        <img src="assets/kaki-logo-256.png" alt="Kaki Tools">
      </div>
    </div>

    <label id="search-wrap" for="search">
      <i data-lucide="search" aria-hidden="true"></i>
      <input id="search" placeholder="搜索剪贴板" autocomplete="off" autofocus>
      <kbd>⌘ F</kbd>
    </label>

    <nav id="tabs" aria-label="收藏分组"></nav>

    <div id="command-hint">⌘1–9 选择 · ↵ 粘贴 · Esc 关闭</div>
    <div id="theme-switcher" role="group" aria-label="外观主题">
      <button class="theme-option" data-theme-value="system" aria-label="跟随系统" title="跟随系统">
        <i data-lucide="monitor" aria-hidden="true"></i>
      </button>
      <button class="theme-option" data-theme-value="light" aria-label="浅色模式" title="浅色模式">
        <i data-lucide="sun" aria-hidden="true"></i>
      </button>
      <button class="theme-option" data-theme-value="dark" aria-label="深色模式" title="深色模式">
        <i data-lucide="moon" aria-hidden="true"></i>
      </button>
    </div>
    <button id="quit-app" class="icon-button command-quit" aria-label="退出 Kaki Tools" title="退出 Kaki Tools（⌘Q）">
      <i data-lucide="power" aria-hidden="true"></i>
    </button>
  </header>

  <main id="workspace">
    <aside id="sidebar" aria-label="剪贴板类型">
      <div class="sidebar-label">LIBRARY</div>
      <button class="side-filter active" data-f="all">
        <i data-lucide="grid-2x2" aria-hidden="true"></i>
        <span>全部</span><strong data-count="all">0</strong>
      </button>
      <button class="side-filter" data-f="text">
        <i data-lucide="type" aria-hidden="true"></i>
        <span>文本</span><strong data-count="text">0</strong>
      </button>
      <button class="side-filter" data-f="image">
        <i data-lucide="image" aria-hidden="true"></i>
        <span>图片</span><strong data-count="image">0</strong>
      </button>
      <button class="side-filter" data-f="pinned">
        <i data-lucide="pin" aria-hidden="true"></i>
        <span>固定</span><strong data-count="pinned">0</strong>
      </button>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-status"><span></span>LOCAL ONLY</div>
    </aside>

    <section id="content" aria-label="剪贴板历史">
      <div id="cards" role="listbox" aria-label="剪贴板历史"></div>
      <div id="empty" hidden>
        <i data-lucide="clipboard" aria-hidden="true"></i>
        <strong>还没有剪贴板记录</strong>
        <span>复制文本或图片后会自动出现在这里</span>
      </div>

      <footer id="actionbar">
        <div id="selection-summary">
          <span id="selection-index">—</span>
          <span id="selection-copy">选择一个项目开始操作</span>
        </div>
        <div id="actions">
          <button id="action-paste" class="action primary">
            <i data-lucide="corner-down-left" aria-hidden="true"></i><span>粘贴</span><kbd>↵</kbd>
          </button>
          <button id="action-plain" class="action">
            <i data-lucide="type" aria-hidden="true"></i><span>纯文本</span><kbd>⇧↵</kbd>
          </button>
          <button id="action-pin" class="action">
            <i data-lucide="pin" aria-hidden="true"></i><span>固定</span><kbd>⌘P</kbd>
          </button>
          <button id="action-delete" class="action danger">
            <i data-lucide="trash-2" aria-hidden="true"></i><span>删除</span><kbd>⌫</kbd>
          </button>
        </div>
      </footer>
    </section>
  </main>

  <div id="board-prompt" hidden>
    <div id="board-prompt-box">
      <div class="prompt-mark"><i data-lucide="folder-plus" aria-hidden="true"></i></div>
      <div class="prompt-content">
        <div id="board-prompt-title">新建分组</div>
        <input id="board-prompt-input" placeholder="输入分组名称" maxlength="20">
      </div>
      <button id="board-prompt-cancel" class="icon-button" aria-label="取消"><i data-lucide="x"></i></button>
    </div>
  </div>

  <div id="item-metadata" hidden>
    <form id="item-metadata-box">
      <div class="metadata-heading">
        <div class="prompt-mark"><i data-lucide="tag" aria-hidden="true"></i></div>
        <div><strong>标签与备注</strong><span>帮助你识别长期保存的内容</span></div>
        <button id="item-metadata-close" class="icon-button" type="button" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
      <label>标签<input id="item-tags" maxlength="180" placeholder="例如：项目，参考，重要"></label>
      <p>用逗号分隔，最多 8 个标签。</p>
      <label>备注<textarea id="item-note" maxlength="280" rows="3" placeholder="写下一句你以后需要看到的说明…"></textarea></label>
      <footer><button id="item-metadata-cancel" type="button">取消</button><button class="primary" type="submit">保存</button></footer>
    </form>
  </div>

  <script src="vendor/lucide/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
