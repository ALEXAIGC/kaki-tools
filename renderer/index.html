<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>Kaki Tools</title>
  <link rel="stylesheet" href="vendor/phosphor/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="commandbar">
    <div id="brand-mark" aria-label="Kaki Tools">
      <img src="assets/kaki-k-mark-tight.png" alt="K">
    </div>

    <label id="search-wrap" for="search">
      <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
      <input id="search" placeholder="搜索剪贴板" autocomplete="off" autofocus>
      <kbd>⌘ F</kbd>
    </label>

    <nav id="tabs" aria-label="收藏分组"></nav>

    <div id="command-hint">⌘1–9 选择 · ↵ 粘贴 · Esc 关闭</div>
  </header>

  <main id="workspace">
    <aside id="sidebar" aria-label="剪贴板类型">
      <div class="sidebar-label">LIBRARY</div>
      <button class="side-filter active" data-f="all">
        <i class="ph ph-squares-four" aria-hidden="true"></i>
        <span>全部</span><strong data-count="all">0</strong>
      </button>
      <button class="side-filter" data-f="text">
        <i class="ph ph-text-t" aria-hidden="true"></i>
        <span>文本</span><strong data-count="text">0</strong>
      </button>
      <button class="side-filter" data-f="image">
        <i class="ph ph-image" aria-hidden="true"></i>
        <span>图片</span><strong data-count="image">0</strong>
      </button>
      <button class="side-filter" data-f="pinned">
        <i class="ph ph-push-pin" aria-hidden="true"></i>
        <span>固定</span><strong data-count="pinned">0</strong>
      </button>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-status"><span></span>LOCAL ONLY</div>
    </aside>

    <section id="content" aria-label="剪贴板历史">
      <div id="cards"></div>
      <div id="empty" hidden>
        <i class="ph ph-clipboard-text" aria-hidden="true"></i>
        <strong>还没有剪贴板记录</strong>
        <span>复制文本或图片后会自动出现在这里</span>
      </div>

      <footer id="actionbar">
        <div id="selection-summary">
          <span id="selection-index">—</span>
          <span id="selection-copy">选择一个项目开始操作</span>
        </div>
        <div id="actions">
          <button id="action-paste" class="action primary">
            <i class="ph ph-arrow-bend-left-down" aria-hidden="true"></i><span>粘贴</span><kbd>↵</kbd>
          </button>
          <button id="action-plain" class="action">
            <i class="ph ph-text-t" aria-hidden="true"></i><span>纯文本</span><kbd>⇧↵</kbd>
          </button>
          <button id="action-pin" class="action">
            <i class="ph ph-push-pin" aria-hidden="true"></i><span>固定</span><kbd>⌘P</kbd>
          </button>
          <button id="action-delete" class="action danger">
            <i class="ph ph-trash" aria-hidden="true"></i><span>删除</span><kbd>⌫</kbd>
          </button>
        </div>
      </footer>
    </section>
  </main>

  <div id="board-prompt" hidden>
    <div id="board-prompt-box">
      <div class="prompt-mark"><i class="ph ph-folder-plus" aria-hidden="true"></i></div>
      <div class="prompt-content">
        <div id="board-prompt-title">新建分组</div>
        <input id="board-prompt-input" placeholder="输入分组名称" maxlength="20">
      </div>
      <button id="board-prompt-cancel" class="icon-button" aria-label="取消"><i class="ph ph-x"></i></button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
