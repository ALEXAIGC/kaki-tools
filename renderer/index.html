<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>Kaki Tools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="topbar">
    <div id="search-wrap">
      <span id="search-icon">🔍</span>
      <input id="search" placeholder="搜索剪贴板…" autofocus>
    </div>
    <div id="tabs"></div>
    <div id="chips">
      <button class="chip active" data-f="all">全部</button>
      <button class="chip" data-f="text">文本</button>
      <button class="chip" data-f="image">图片</button>
      <button class="chip" data-f="pinned">已固定</button>
    </div>
    <div id="hint">⌘1-9 直接使用 · ⇧ 纯文本 · 右键 收藏 · Esc 关闭</div>
  </div>
  <div id="cards"></div>
  <div id="empty" hidden>还没有剪贴板记录 — 去复制点什么吧</div>

  <div id="board-prompt" hidden>
    <div id="board-prompt-box">
      <div id="board-prompt-title">新建标签页</div>
      <input id="board-prompt-input" placeholder="标签页名称,回车确认" maxlength="20">
      <button id="board-prompt-cancel">取消</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
